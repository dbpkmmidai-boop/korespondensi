<style id="deep-sea-futurism-theme">
:root {
  color-scheme: dark;
  --ds-bg: #041522;
  --ds-panel: rgba(7, 31, 49, .88);
  --ds-panel-2: rgba(10, 45, 66, .92);
  --ds-cyan: #62efff;
  --ds-cyan-soft: #a5f7ff;
  --ds-border: rgba(98, 239, 255, .34);
  --ds-text: #e8fbff;
}
html { min-height: 100%; background: var(--ds-bg); }
body {
  background:
    radial-gradient(ellipse at 12% 0%, rgba(0, 210, 255, .17), transparent 38%),
    radial-gradient(ellipse at 88% 18%, rgba(16, 111, 180, .22), transparent 36%),
    linear-gradient(145deg, #020b16 0%, #06263b 48%, #041522 100%) !important;
  color: var(--ds-text) !important;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .35;
  background-image:
    radial-gradient(circle at 18% 24%, rgba(98,239,255,.25) 0 1px, transparent 2px),
    radial-gradient(circle at 76% 66%, rgba(98,239,255,.18) 0 1px, transparent 2px),
    linear-gradient(115deg, transparent 0 48%, rgba(98,239,255,.035) 49%, transparent 50%);
  background-size: 97px 113px, 137px 151px, 100% 100%;
}
header {
  background: linear-gradient(105deg, rgba(4, 24, 41, .97), rgba(5, 70, 91, .95)) !important;
  border-bottom: 1px solid var(--ds-border);
  box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 1px 0 rgba(98,239,255,.12) !important;
  backdrop-filter: blur(18px);
}
header h1 { color: #f1fdff !important; letter-spacing: .025em; }
header p, header .text-teal-100 { color: #a7efff !important; }
header .text-teal-200 { color: var(--ds-cyan) !important; }
a, button {
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
}
header a, header button {
  border: 1px solid rgba(98,239,255,.28) !important;
  box-shadow: 0 0 0 1px rgba(98,239,255,.04), 0 0 18px rgba(0,206,255,.07);
}
header a:hover, header button:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 20px rgba(98,239,255,.2) !important;
}
header a.bg-slate-600, header a.bg-slate-700 {
  background: rgba(11, 47, 69, .92) !important;
  color: #e5fbff !important;
}
header button.bg-emerald-600, header button.bg-emerald-700 {
  background: linear-gradient(135deg, #087d91, #06a6bd) !important;
  color: #f1feff !important;
}
main { position: relative; z-index: 1; }
main > div, main .bg-white {
  background: rgba(5, 23, 37, .88) !important;
  border: 1px solid var(--ds-border) !important;
  border-radius: 16px !important;
  box-shadow: 0 18px 50px rgba(0,0,0,.32), inset 0 1px 0 rgba(180,250,255,.05) !important;
  overflow: hidden;
}
/* Dokumen PDF tetap putih; tema hanya mengubah bingkai aplikasinya. */
embed, iframe, object {
  background: #fff;
  border: 0;
}
@media (max-width: 640px) {
  header { padding-left: 1rem !important; padding-right: 1rem !important; }
  header .max-w-7xl > div:last-child { width: 100%; flex-wrap: wrap; }
  header a, header button { justify-content: center; }
  main { padding: .75rem !important; }
}
@media print {
  body { background: #fff !important; color: #000 !important; }
  body::before { display: none !important; }
  header { display: none !important; }
  main > div, main .bg-white {
    background: #fff !important; box-shadow: none !important;
    border: 0 !important; border-radius: 0 !important;
  }
}
</style>

</head>

        </div>
